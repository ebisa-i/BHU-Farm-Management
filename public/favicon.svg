<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="32" fill="#10352a"/>

  <!-- Cow head — simplified, recognisable -->
  <!-- Head body -->
  <ellipse cx="32" cy="35" rx="14" ry="12" fill="#f0ede6"/>

  <!-- Left ear -->
  <ellipse cx="18" cy="27" rx="5" ry="3.5" fill="#f0ede6" transform="rotate(-20 18 27)"/>
  <ellipse cx="18" cy="27" rx="3" ry="2" fill="#e8b4b8" transform="rotate(-20 18 27)"/>

  <!-- Right ear -->
  <ellipse cx="46" cy="27" rx="5" ry="3.5" fill="#f0ede6" transform="rotate(20 46 27)"/>
  <ellipse cx="46" cy="27" rx="3" ry="2" fill="#e8b4b8" transform="rotate(20 46 27)"/>

  <!-- Horns -->
  <path d="M22 24 Q17 16 14 18" stroke="#d4a84b" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M42 24 Q47 16 50 18" stroke="#d4a84b" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Snout -->
  <ellipse cx="32" cy="40" rx="8" ry="5.5" fill="#e8c4b8"/>
  <!-- Nostrils -->
  <ellipse cx="29" cy="40" rx="1.5" ry="1.2" fill="#c49090"/>
  <ellipse cx="35" cy="40" rx="1.5" ry="1.2" fill="#c49090"/>

  <!-- Eyes -->
  <circle cx="26" cy="32" r="2.5" fill="#2d1a0e"/>
  <circle cx="38" cy="32" r="2.5" fill="#2d1a0e"/>
  <!-- Eye shine -->
  <circle cx="27" cy="31" r="0.8" fill="white"/>
  <circle cx="39" cy="31" r="0.8" fill="white"/>

  <!-- Cow spots -->
  <ellipse cx="28" cy="27" rx="3" ry="2" fill="#c8bfb0" opacity="0.5"/>
  <ellipse cx="37" cy="29" rx="2.5" ry="1.8" fill="#c8bfb0" opacity="0.5"/>

  <!-- Small green leaf / farm accent at bottom -->
  <path d="M26 50 Q32 44 38 50" stroke="#4ade80" stroke-width="1.8" stroke-linecap="round" fill="none"/>
</svg>
